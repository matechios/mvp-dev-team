<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVP - Dev Team</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #14b8a6;
      --accent-dark: #0d9488;
      --accent-soft: #ccfbf1;
      --track: #e5e7eb;
      --danger: #dc2626;
      --success: #15803d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 48px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    /* Header */
    .hero {
      padding: 28px 32px 22px;
      position: sticky;
      top: 0;
      z-index: 20;
      border-radius: 11px 11px 0 0;
      box-shadow: 0 8px 20px -10px rgba(13, 148, 136, .55);
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(90% 130% at 0% 0%, rgba(94, 234, 212, .55) 0%, transparent 60%),
        radial-gradient(80% 120% at 100% 100%, rgba(8, 145, 178, .55) 0%, transparent 65%),
        linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
      color: #fff;
    }
    .hero::before {
      content: "";
      position: absolute; z-index: -1;
      top: -110px; right: -70px;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, .28) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
    }
    .hero::after {
      content: "";
      position: absolute; z-index: -1;
      left: 0; right: 0; top: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent);
    }
    .hero-top { display: flex; align-items: center; gap: 16px; }
    .hero-date { margin-left: auto; text-align: right; white-space: nowrap; }
    .d-weekday {
      font-size: 11px; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: rgba(255, 255, 255, .65);
      margin-bottom: 3px;
    }
    .d-full { font-size: 15px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
    .logo {
      flex: none;
      width: 46px; height: 46px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .22);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 22px; height: 22px; }
    .header-text { min-width: 0; }
    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .65);
      margin-bottom: 3px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .body { padding: 8px 32px 32px; }

    .stats {
      display: flex;
      gap: 0;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, .14);
    }
    .stat { flex: 1; min-width: 0; }
    .stat .v { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .chip {
      min-width: 0; max-width: 100%;
      padding: 2px 8px;
      font-size: 11px; font-weight: 600; line-height: 1.5;
      color: #fff; background: rgba(255, 255, 255, .2);
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .stat + .stat { padding-left: 20px; border-left: 1px solid rgba(255, 255, 255, .14); }
    .stat .k { font-size: 12px; color: rgba(255, 255, 255, .6); margin-bottom: 3px; }
    .stat .v { font-size: 22px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }

    .row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 56px;
      gap: 10px 16px;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-of-type { border-bottom: none; }
    .name { font-size: 14px; font-weight: 500; }
    .num {
      grid-row: span 2;
      grid-column: 2;
      width: 56px; height: 34px;
      text-align: center;
      font: inherit; font-size: 14px; font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      -moz-appearance: textfield;
    }
    .num::-webkit-outer-spin-button, .num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .num:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(20, 184, 166, .22); }
    .row.dup .num { border-color: var(--danger); color: var(--danger); }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px; border-radius: 999px;
      outline: none; cursor: pointer;
      background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--track) var(--p, 0%));
    }
    .row.dup input[type="range"] {
      background: linear-gradient(to right, var(--danger) var(--p, 0%), #fecaca var(--p, 0%));
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: #fff; border: 2px solid var(--accent);
      transition: transform .12s;
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: #fff; border: 2px solid var(--accent);
    }
    input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.15); }
    .row.dup input[type="range"]::-webkit-slider-thumb { border-color: var(--danger); }
    .row.dup input[type="range"]::-moz-range-thumb { border-color: var(--danger); }

    /* ===== Hiệu ứng theo thang điểm (chỉ ở ô điểm) ===== */
    .score { position: relative; grid-row: span 2; grid-column: 2; width: 56px; height: 34px; }
    .score.pop { animation: boxPop .4s cubic-bezier(.34, 1.56, .64, 1); }
    @keyframes boxPop { 0% { transform: scale(.85); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }
    .score .num {
      width: 100%; height: 100%;
      transition: border-color .3s, background-color .3s, color .3s, box-shadow .3s;
    }
    .score .num { cursor: default; caret-color: transparent; user-select: none; -webkit-user-select: none; }
    .score .num:focus { box-shadow: none; }

    /* 0-19: u ám - xám đá, chập chờn như đèn sắp tắt, khói xám bốc lên */
    .row[data-tier="0"]:not(.dup) .num {
      border-color: #64748b; color: #e2e8f0;
      background: radial-gradient(circle at 50% 120%, #64748b 0%, #1e293b 85%);
      animation: gloom 3.2s ease-in-out infinite, flicker 4.5s steps(1, end) infinite;
    }
    @keyframes gloom {
      0%, 100% { box-shadow: inset 0 0 8px rgba(15, 23, 42, .55), 0 0 0 0 rgba(51, 65, 85, 0); }
      50% { box-shadow: inset 0 0 14px rgba(15, 23, 42, .75), 0 0 10px 1px rgba(71, 85, 105, .45); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; } 88% { opacity: .75; } 89% { opacity: 1; }
      93% { opacity: .6; } 94% { opacity: .95; } 96% { opacity: .7; } 97% { opacity: 1; }
    }
    .row[data-tier="0"]:not(.dup) .score::before,
    .row[data-tier="0"]:not(.dup) .score::after {
      content: ""; position: absolute; pointer-events: none;
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(100, 116, 139, .5); filter: blur(3px);
      left: 8px; top: 0; opacity: 0;
      animation: smoke 2.6s ease-out infinite;
    }
    .row[data-tier="0"]:not(.dup) .score::after { left: 34px; width: 8px; height: 8px; animation-delay: 1.3s; animation-duration: 3s; }
    @keyframes smoke {
      0% { transform: translateY(0) scale(.6); opacity: 0; }
      25% { opacity: .8; }
      100% { transform: translateY(-30px) scale(1.9); opacity: 0; }
    }
    /* 20-39: cảnh báo - nền đỏ nhạt, viền phát sáng nhẹ, dấu x nổi lên từ ô */
    .row[data-tier="1"] { --glow: 248, 113, 113; --spd: 2.8s; }
    .row[data-tier="1"]:not(.dup) .num {
      border-color: #f87171; color: #991b1b;
      background: linear-gradient(#fee2e2, #fca5a5);
      animation: glow var(--spd) ease-in-out infinite;
    }
    .row[data-tier="1"]:not(.dup) .score::before,
    .row[data-tier="1"]:not(.dup) .score::after {
      content: "✕"; position: absolute; pointer-events: none;
      font-size: 10px; font-weight: 800; line-height: 1; color: #ef4444;
      left: 10px; top: 2px; opacity: 0;
      animation: crossUp 2.4s ease-out infinite;
    }
    .row[data-tier="1"]:not(.dup) .score::after { left: 36px; font-size: 8px; animation-delay: 1.2s; animation-duration: 2.8s; }
    @keyframes crossUp {
      0% { transform: translateY(0) rotate(-20deg) scale(.6); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-28px) rotate(25deg) scale(1.1); opacity: 0; }
    }
    /* 40-69: xanh dương - nền gradient xanh dương, vòng sóng lan tỏa */
    .row[data-tier="2"]:not(.dup) .num {
      border-color: #3b82f6; color: #1e3a8a;
      background: linear-gradient(#dbeafe, #60a5fa);
      animation: ripple 2.2s ease-out infinite;
    }
    @keyframes ripple {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, .55); }
      100% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
    }
    /* 70-99: nền gradient + ánh sáng quét + viền phát sáng */
    .row[data-tier="3"] { --bd: #2dd4bf; --ink: #134e4a; --c1: #ccfbf1; --c2: #5eead4; --glow: 45, 212, 191; --spd: 2.4s; }  /* 70-84 ngọc */
    .row[data-tier="4"] { --bd: #f59e0b; --ink: #92400e; --c1: #fef3c7; --c2: #fcd34d; --glow: 245, 158, 11; --spd: 2s; }     /* 85-99 vàng kim */
    .row:is([data-tier="3"], [data-tier="4"]):not(.dup) .num {
      border-color: var(--bd); color: var(--ink);
      background:
        linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, .95) 50%, transparent 65%) no-repeat,
        linear-gradient(var(--c1), var(--c2));
      background-size: 250% 100%, 100% 100%;
      animation: shine var(--spd) ease-in-out infinite, glow var(--spd) ease-in-out infinite;
    }
    @keyframes shine { 0% { background-position: 160% 0, 0 0; } 60%, 100% { background-position: -60% 0, 0 0; } }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(var(--glow), .3), 0 0 6px rgba(var(--glow), .35); }
      50% { box-shadow: 0 0 0 3px rgba(var(--glow), .18), 0 0 14px rgba(var(--glow), .6); }
    }
    /* 100: lửa rực cháy - nền lửa chuyển động, chữ trắng */
    .row[data-tier="5"]:not(.dup) .num {
      border-color: #dc2626; color: #fff; text-shadow: 0 1px 3px rgba(127, 29, 29, .7);
      background: linear-gradient(0deg, #dc2626, #f97316, #fbbf24, #f97316, #dc2626);
      background-size: 100% 300%;
      animation: fireFlow 1.1s linear infinite, firePulse 1s ease-in-out infinite;
    }
    @keyframes fireFlow { from { background-position: 0 0; } to { background-position: 0 100%; } }
    @keyframes firePulse {
      0%, 100% { box-shadow: 0 0 6px rgba(249, 115, 22, .5), 0 0 0 0 rgba(239, 68, 68, .35); }
      50% { box-shadow: 0 0 18px rgba(239, 68, 68, .75), 0 0 0 3px rgba(249, 115, 22, .2); }
    }
    /* tàn lửa bay lên từ ô điểm */
    .row[data-tier="5"]:not(.dup) .score::before,
    .row[data-tier="5"]:not(.dup) .score::after {
      content: ""; position: absolute; pointer-events: none;
      width: 5px; height: 5px; border-radius: 50%;
      background: #fb923c; box-shadow: 0 0 6px 1px rgba(249, 115, 22, .8);
      left: 12px; top: 2px; opacity: 0;
      animation: ember 1.6s ease-out infinite;
    }
    .row[data-tier="5"]:not(.dup) .score::after { left: 36px; width: 4px; height: 4px; background: #fbbf24; animation-delay: .8s; animation-duration: 1.9s; }
    @keyframes ember {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-26px) scale(.3); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .score, .score .num, .score::before, .score::after { animation: none !important; }
    }

    .actions { display: flex; gap: 10px; margin-top: 24px; }
    button {
      font: inherit; font-size: 14px; font-weight: 500;
      height: 42px; padding: 0 18px;
      border-radius: 8px; cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .btn-primary {
      flex: 1;
      color: #fff; background: var(--accent); border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); }
    .btn-primary:disabled { opacity: .35; cursor: not-allowed; }
    .warn-wrap { position: relative; flex: none; }
    .btn-warn {
      width: 42px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); background: #fff; border: 1px solid var(--line);
      transition: color .2s, background .2s, border-color .2s;
    }
    .btn-warn svg { width: 18px; height: 18px; }
    .btn-warn:hover { background: #f3f4f6; }
    .btn-warn.active { color: var(--danger); background: #fef2f2; border-color: #fecaca; }
    .btn-warn.active:hover { background: #fee2e2; }
    .btn-warn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-warn.active.pulse { animation: pulse .5s ease; }
    @keyframes pulse { 0%,100% { transform: none; } 30% { transform: translateX(-2px); } 60% { transform: translateX(2px); } }

    .tooltip {
      position: absolute; left: 0; bottom: calc(100% + 10px);
      width: max-content; max-width: min(280px, calc(100vw - 56px));
      padding: 9px 12px;
      font-size: 13px; font-weight: 500; line-height: 1.45;
      color: #fff; background: var(--text);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(17, 24, 39, .18);
      opacity: 0; visibility: hidden; transform: translateY(4px);
      transition: opacity .15s ease, transform .15s ease, visibility .15s;
      pointer-events: none; z-index: 5;
    }
    .tooltip::after {
      content: ""; position: absolute; left: 15px; top: 100%;
      border: 6px solid transparent; border-top-color: var(--text);
    }
    .btn-warn.active ~ .tooltip { background: var(--danger); }
    .btn-warn.active ~ .tooltip::after { border-top-color: var(--danger); }
    .warn-wrap.open .tooltip,
    .btn-warn:focus-visible ~ .tooltip { opacity: 1; visibility: visible; transform: none; }
    @media (hover: hover) {
      .warn-wrap:hover .tooltip { opacity: 1; visibility: visible; transform: none; }
    }
    .spinner {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
      animation: spin .7s linear infinite; display: none;
    }
    .loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translate(-50%, 12px);
      padding: 10px 16px;
      font-size: 13px; font-weight: 500;
      color: #fff; background: var(--text);
      border-radius: 8px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.ok { background: var(--success); }
    .toast.err { background: var(--danger); }

    .thanks {
      display: none;
      text-align: center;
      padding: 48px 8px 40px;
      animation: fadeUp .35s ease both;
    }
    .thanks.show { display: block; }
    .thanks-icon {
      width: 60px; height: 60px; margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
    }
    .thanks-icon svg { width: 28px; height: 28px; }
    .thanks h2 { margin: 0 0 6px; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
    .thanks p { margin: 0; font-size: 14px; color: var(--muted); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 480px) {
      body { padding: 20px 12px; }
      .hero { padding: 22px 18px 18px; }
      .body { padding: 4px 18px 22px; }
      .stat + .stat { padding-left: 12px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <header class="hero">
      <div class="hero-top">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>
        </svg>
      </div>
      <div class="header-text">
        <div class="eyebrow">Matechmobile</div>
        <h1>MVP - Dev Team</h1>
      </div>
      <div class="hero-date">
        <div class="d-weekday" id="dateWeekday"></div>
        <div class="d-full" id="dateFull"></div>
      </div>
      </div>
    <div class="stats">
      <div class="stat"><div class="k">Trung bình</div><div class="v" id="statAvg">0</div></div>
      <div class="stat"><div class="k">Cao nhất</div><div class="v"><span id="statMax">0</span><span class="chip" id="chipMax"></span></div></div>
      <div class="stat"><div class="k">Thấp nhất</div><div class="v"><span id="statMin">0</span><span class="chip" id="chipMin"></span></div></div>
    </div>
    </header>

    <div class="body">

    <div class="thanks" id="thanks" role="status">
      <div class="thanks-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h2>Cảm ơn bạn!</h2>
      <p>Điểm đánh giá của bạn đã được ghi nhận.</p>
    </div>

    <form id="larkForm" novalidate>
      <div id="sliders-container"></div>

      <div class="actions">
        <div class="warn-wrap" id="warnWrap">
          <button type="button" class="btn-warn" id="warnBtn" aria-label="Cảnh báo" aria-describedby="warnTip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          </button>
          <div class="tooltip" id="warnTip" role="tooltip">Không được spam điểm, chỉ tối đa 4 người bằng điểm nhau.</div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="spinner"></span><span id="submitText">Gửi dữ liệu</span>
        </button>
      </div>
    </form>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // DÁN LINK WEBHOOK LARK BASE CỦA BẠN VÀO ĐÂY
  const WEBHOOK_URL = "https://asg8xrpvwuif.sg.larksuite.com/base/automation/webhook/event/MgbraiExSwSE72hhYwlleYCOgee";

  const members = [
    { key: "TheAnh", label: "Thế Anh" },
    { key: "Nga",    label: "Nga" },
    { key: "Thai",   label: "Thái" },
    { key: "Ty",     label: "Ty" },
    { key: "Ly",     label: "Lý" },
    { key: "Loi",    label: "Lợi" },
    { key: "Khanh",  label: "Khánh" },
    { key: "Toan",   label: "Toàn" }
  ];

  const container = document.getElementById("sliders-container");
  const warnBtn   = document.getElementById("warnBtn");
  const warnWrap  = document.getElementById("warnWrap");
  const submitBtn = document.getElementById("submitBtn");
  const submitTxt = document.getElementById("submitText");
  const toastEl   = document.getElementById("toast");

  (function showDate() {
    const d = new Date();
    const weekday = d.toLocaleDateString("vi-VN", { weekday: "long" });
    const full = d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
    document.getElementById("dateWeekday").textContent = weekday;
    document.getElementById("dateFull").textContent = full;
  })();

  const defaults = members.map((_, i) => 50);

  members.forEach((m, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.id = `row-${m.key}`;
    row.innerHTML = `
      <label class="name" for="${m.key}">${m.label}</label>
      <div class="score">
        <input type="number" class="num" id="num-${m.key}" min="0" max="100" value="${defaults[i]}" readonly tabindex="-1" aria-label="Điểm của ${m.label}">
      </div>
      <input type="range" id="${m.key}" name="${m.key}" min="0" max="100" value="${defaults[i]}">
    `;
    container.appendChild(row);
  });

  function tierOf(v) { return v >= 100 ? 5 : v >= 85 ? 4 : v >= 70 ? 3 : v >= 40 ? 2 : v >= 20 ? 1 : 0; }
  function updateTier(m, val) {
    const row = document.getElementById(`row-${m.key}`);
    const tier = String(tierOf(val));
    if (row.dataset.tier === tier) return;
    const first = row.dataset.tier === undefined;
    row.dataset.tier = tier;
    if (first) return;
    const box = row.querySelector(".score");
    box.classList.remove("pop");
    void box.offsetWidth;
    box.classList.add("pop");
  }

  function clamp(v) {
    v = Math.round(Number(v));
    if (isNaN(v)) v = 0;
    return Math.min(100, Math.max(0, v));
  }

  function showToast(msg, type) {
    toastEl.textContent = msg;
    toastEl.className = "toast show " + (type || "");
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => toastEl.classList.remove("show"), 3000);
  }

  function validateSliders() {
    const counts = {};
    const values = [];

    members.forEach(m => {
      const el = document.getElementById(m.key);
      const val = clamp(el.value);
      values.push(val);
      updateTier(m, val);
      counts[val] = (counts[val] || 0) + 1;
      el.style.setProperty("--p", val + "%");
    });

    const dupScores = Object.keys(counts).filter(k => counts[k] >= 4);

    members.forEach((m, i) => {
      document.getElementById(`row-${m.key}`).classList.toggle("dup", dupScores.includes(String(values[i])));
    });

    const sum = values.reduce((a, b) => a + b, 0);
    document.getElementById("statAvg").textContent = (sum / values.length).toFixed(1).replace(/\.0$/, "");
    function setExtreme(id, v) {
      const names = members.filter((_, i) => values[i] === v).map(m => m.label);
      document.getElementById("stat" + id).textContent = v;
      const chip = document.getElementById("chip" + id);
      chip.textContent = names.length === members.length ? "Tất cả" : names[0] + (names.length > 1 ? ` +${names.length - 1}` : "");
      chip.title = names.join(", ");
    }
    setExtreme("Max", Math.max(...values));
    setExtreme("Min", Math.min(...values));

    if (dupScores.length) {
      if (!warnBtn.classList.contains("active")) {
        warnBtn.classList.add("active", "pulse");
        setTimeout(() => warnBtn.classList.remove("pulse"), 500);
      }
      submitBtn.disabled = true;
      return false;
    }
    warnBtn.classList.remove("active");
    submitBtn.disabled = false;
    return true;
  }

  container.addEventListener("input", e => {
    const t = e.target;
    if (t.type === "range") {
      document.getElementById(`num-${t.id}`).value = t.value;
    } else if (t.classList.contains("num")) {
      if (t.value === "") return;
      document.getElementById(t.id.replace("num-", "")).value = clamp(t.value);
    }
    validateSliders();
  });

  container.addEventListener("focusout", e => {
    if (e.target.classList.contains("num")) {
      const key = e.target.id.replace("num-", "");
      e.target.value = clamp(e.target.value);
      document.getElementById(key).value = e.target.value;
      validateSliders();
    }
  });

  // Click: hiện tooltip 3 giây rồi tự ẩn. Rê chuột ra ngoài hoặc bấm ra ngoài thì ẩn ngay.
  let tipTimer;
  function closeTip() {
    clearTimeout(tipTimer);
    warnWrap.classList.remove("open");
  }
  warnBtn.addEventListener("click", e => {
    e.stopPropagation();
    if (warnWrap.classList.contains("open")) { closeTip(); return; }
    warnWrap.classList.add("open");
    clearTimeout(tipTimer);
    tipTimer = setTimeout(closeTip, 3000);
  });
  warnWrap.addEventListener("mouseleave", closeTip);
  document.addEventListener("click", closeTip);

  validateSliders();

  document.getElementById("larkForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!validateSliders()) return;

    const payload = {};
    members.forEach(m => { payload[m.key] = Number(document.getElementById(m.key).value); });

    submitBtn.disabled = true;
    submitBtn.classList.add("loading");
    submitTxt.textContent = "Đang gửi...";

    try {
      await fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      document.getElementById("larkForm").style.display = "none";
      document.getElementById("thanks").classList.add("show");
    } catch (err) {
      showToast("Lỗi kết nối, không thể gửi dữ liệu tới Lark", "err");
    } finally {
      submitBtn.classList.remove("loading");
      submitTxt.textContent = "Gửi dữ liệu";
      validateSliders();
    }
  });
</script>

</body>
</html>
